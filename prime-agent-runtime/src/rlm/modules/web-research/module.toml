name = "web-research"
version = 1
description = "Exa-inspired multi-step web research: query decomposition, parallel neural/open-API highlight retrieval, dual primary+critical investigation, claim verification with bounded gap-fill, and cited synthesis."
entry = ["decompose"]
exit = "synthesize"

[wire]
subject = { description = "The state.port with the research question, topic, or spec to investigate." }
done = { description = "The state after the cited research report is synthesized.", optional = true }

[roles]
research-planner = { model = "router", thinking = "medium" }
research-primary = { model = "router", thinking = "high" }
research-critical = { model = "router", thinking = "medium" }
research-verifier = { model = "router", thinking = "high" }
research-synthesizer = { model = "router", thinking = "high" }

[states.decompose]
max_entries = 2
agent = { role = "research-planner", prompt = "prompts/decompose.md" }
inputs = { query = "@subject", prior_gaps = "verify.gaps?" }
outputs = { plan = "text", queries = "json" }
next = "retrieve"

[states.retrieve]
max_entries = 2
kind = "python"
run = "nodes/search.py:retrieve"
inputs = { query = "@subject", queries = "decompose.queries", prior_urls = "verify.seen_urls?" }
outputs = { evidence = "text", urls = "json", backend = "text" }
next = ["investigate-primary", "investigate-critical"]

[states.investigate-primary]
max_entries = 2
agent = { role = "research-primary", prompt = "prompts/investigate_primary.md" }
inputs = { query = "@subject", plan = "decompose.plan", evidence = "retrieve.evidence", backend = "retrieve.backend", prior_gaps = "verify.gaps?" }
outputs = { findings = "text" }
next = "verify"

[states.investigate-critical]
max_entries = 2
agent = { role = "research-critical", prompt = "prompts/investigate_critical.md" }
inputs = { query = "@subject", plan = "decompose.plan", evidence = "retrieve.evidence", backend = "retrieve.backend", prior_gaps = "verify.gaps?" }
outputs = { findings = "text" }
next = "verify"

[states.verify]
max_entries = 2
agent = { role = "research-verifier", prompt = "prompts/verify.md" }
join = ["investigate-primary", "investigate-critical"]
inputs = { query = "@subject", plan = "decompose.plan", primary = "investigate-primary.findings", critical = "investigate-critical.findings", retrieved_urls = "retrieve.urls" }
outputs = { sufficient = "bool", gaps = "text", verified_dossier = "text", seen_urls = "json" }
route = { on = "sufficient", true = "synthesize", false = "decompose" }

[states.synthesize]
max_entries = 1
agent = { role = "research-synthesizer", prompt = "prompts/synthesize.md" }
inputs = { query = "@subject", plan = "decompose.plan", dossier = "verify.verified_dossier", gaps = "verify.gaps" }
outputs = { report = "text", sources = "json" }
next = "@done"
